    <div class="form-box">

        <input type="text" id="t_username" placeholder="Username">
        <input type="text" id="t_phone" placeholder="Phone">
        <input type="email" id="t_email" placeholder="Email">
        <input type="Password" id="t_password" placeholder="Password">

        <input type="file" id="t_image" accept="image/*"><br>

        <p id="msg"></p>
