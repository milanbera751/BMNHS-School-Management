<!DOCTYPE html>
<html>
<head>
    <title>Profile</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

<div class="sidebar">
    <h2>STUDENT</h2>
    <a href="../Dashboard/student.html">Dashboard</a>
    <a href="../pages/marks.html">My Marks</a>
    <a href="../pages/attendance.html">Attendance</a>
    <a href="#">Profile</a>
    <a href="../pages/Notice_view.html">Notices</a>
    <a href="#" onclick="logout()">Logout</a>
</div>

<div class="main">

    <div class="notice-container">
        <h1>My Profile</h1>
        <div id="profile"></div>
    </div>

</div>


<script>
    async function loadProfile() {
        const token = localStorage.getItem("token");

        const res = await fetch("/api/profile", {
            headers: {
                "Authorization": "Bearer " + token
            }
        });

        const data = await res.json();
        document.getElementById("profile").innerText = JSON.stringify(data);
    }

    loadProfile();
</script>

</body>
</html>
